experiment:
  mode: fpv

arena:
  size: 2.0

predators:
  count: 3

observation:
  type: fpv

policy:
  module: policies.policy_fpv

fitness:
  type: paper
  model_states_topic: /model_states

prey:
  controller: gaussian
  sigma_w: 0.2
  sigma_p: 0.25
  alpha: 0.1
  max_forward_speed: 0.12
  max_angular_speed: 1.5

training:
  pop_size: 12
  elites: 4
  generations: 35
  init_sigma: 0.20
  mutation_sigma: 0.12
  evals_per_candidate: 2
  episode_duration: 35.0
  sample_dt: 0.2

startup:
  controller_delay: 2.0