experiment:
  mode: fpv

arena:
  size: 2.0

predators:
  count: 3

observation:
  type: fpv

policy:
  module: policies.policy_fpv

fitness:
  type: paper
  model_states_topic: /model_states

optimizer:
  type: cmaes
  sigma: 0.5

prey:
  controller: gaussian
  sigma_w: 0.2
  sigma_p: 0.25
  alpha: 0.1
  max_forward_speed: 0.12
  max_angular_speed: 0.8
  angular_gain: 0.8
  cruise_speed: 0.12
  turn_speed: 0.01

training:
  pop_size: 13
  generations: 100
  evals_per_candidate: 2
  episode_duration: 30.0
  sample_dt: 0.2

startup:
  controller_delay: 2.0
simulation:
  use_sim_time: true

timing:
  clear_sleep: 0.2
  spawn_sleep: 0.5
  stop_sleep: 0.05
  reset_sleep: 0.10
  policy_sleep: 0.02
  process_start_wall_sleep: 0.20
  startup_timeout_wall: 10.0