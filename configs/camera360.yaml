experiment:
  mode: camera360

arena:
  size: 2.0

predators:
  count: 3

observation:
  type: camera360

policy:
  module: policies.policy_camera360

fitness:
  type: paper
  model_states_topic: /model_states

optimizer:
  type: cmaes
  sigma: 0.5

prey:
  controller: gaussian
  sigma_w: 0.2
  sigma_p: 0.25
  alpha: 0.1
  max_forward_speed: 0.09
  max_angular_speed: 0.8
  angular_gain: 0.8
  cruise_speed: 0.07
  turn_speed: 0.01

training:
  pop_size: 13
  generations: 100
  evals_per_candidate: 1
  episode_duration: 60.0
  sample_dt: 0.2

startup:
  controller_delay: 2.0

timing:
  clear_sleep: 1.0
  spawn_sleep: 2.0
  stop_sleep: 0.2
  reset_sleep: 0.8
  policy_sleep: 0.05